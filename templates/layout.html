<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Pentest Recon Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(180deg, #f7f9fc 0%, #eef3f8 100%);
      color: #1f2a37;
      font-family: "Segoe UI", Tahoma, sans-serif;
    }
    .navbar-brand { font-weight: 700; }
    .card {
      border: 1px solid rgba(15, 23, 42, 0.06);
      border-radius: 14px;
    }
    .stat-card {
      border-left: 5px solid transparent;
      min-height: 120px;
    }
    .stat-card.danger { border-left-color: #dc3545; }
    .stat-card.success { border-left-color: #198754; }
    .stat-card.warning { border-left-color: #ffc107; }
    .stat-card.info { border-left-color: #0dcaf0; }
    .stat-label {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: #6c757d;
      margin-bottom: 8px;
    }
    .stat-value {
      font-size: 2rem;
      font-weight: 800;
      line-height: 1;
    }
    .priority-P1 { background-color: #dc3545; color: white; }
    .priority-P2 { background-color: #fd7e14; color: white; }
    .priority-P3 { background-color: #ffc107; color: #1f2a37; }
    .priority-P4 { background-color: #198754; color: white; }
    .table > :not(caption) > * > * {
      padding-top: 0.9rem;
      padding-bottom: 0.9rem;
    }
    .form-label {
      font-size: 0.78rem;
      font-weight: 600;
      color: #495057;
      margin-bottom: 0.35rem;
    }
  </style>
</head>
<body>
  <nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
      <a class="navbar-brand" href="/">🎯 Pentest Recon Dashboard</a>
      <div class="d-flex gap-2">
        <a class="btn btn-outline-light btn-sm" href="/">Dashboard</a>
        <a class="btn btn-outline-light btn-sm" href="/methodology">Méthodologie</a>
        <a class="btn btn-outline-light btn-sm" href="/export.json">Export JSON</a>
      </div>
    </div>
  </nav>
  <div class="container pb-5">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
